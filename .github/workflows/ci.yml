name: Phase 01 quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Validate, test, build, and smoke test
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Show service logs after a failure
        if: failure()
        run: docker compose logs --no-color
      - name: Stop local services
        if: always()
        run: docker compose down --volumes
