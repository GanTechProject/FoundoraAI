name: foundora

x-api-environment: &api-environment
  FOUNDORA_DATABASE_URL: postgresql+asyncpg://foundora@postgres:5432/foundora
  FOUNDORA_REDIS_URL: redis://redis:6379/0
  FOUNDORA_LOG_LEVEL: ${FOUNDORA_LOG_LEVEL:-INFO}
  FOUNDORA_PUBLIC_ORIGIN: http://localhost:${WEB_PORT:-3000}
  FOUNDORA_MODEL_PRIMARY_PROVIDER: ${FOUNDORA_MODEL_PRIMARY_PROVIDER:-openai}
  FOUNDORA_MODEL_FALLBACK_PROVIDERS: ${FOUNDORA_MODEL_FALLBACK_PROVIDERS:-gemini,anthropic}
  FOUNDORA_MODEL_TASK_ROUTES: '${FOUNDORA_MODEL_TASK_ROUTES:-{}}'
  FOUNDORA_MODEL_MAX_RETRIES: ${FOUNDORA_MODEL_MAX_RETRIES:-2}
  FOUNDORA_MODEL_TIMEOUT_SECONDS: ${FOUNDORA_MODEL_TIMEOUT_SECONDS:-30}
  FOUNDORA_MODEL_DEFAULT_MAX_OUTPUT_TOKENS: ${FOUNDORA_MODEL_DEFAULT_MAX_OUTPUT_TOKENS:-512}
  FOUNDORA_MODEL_HARD_MAX_OUTPUT_TOKENS: ${FOUNDORA_MODEL_HARD_MAX_OUTPUT_TOKENS:-24000}
  FOUNDORA_MODEL_DEFAULT_TOKEN_BUDGET: ${FOUNDORA_MODEL_DEFAULT_TOKEN_BUDGET:-8192}
  FOUNDORA_MODEL_DEFAULT_COST_BUDGET_MICROUSD: ${FOUNDORA_MODEL_DEFAULT_COST_BUDGET_MICROUSD:-100000}
  FOUNDORA_KNOWLEDGE_STORAGE_BACKEND: ${FOUNDORA_KNOWLEDGE_STORAGE_BACKEND:-local}
  FOUNDORA_KNOWLEDGE_STORAGE_PATH: ${FOUNDORA_KNOWLEDGE_STORAGE_PATH:-/var/lib/foundora/knowledge}
  FOUNDORA_KNOWLEDGE_MAX_UPLOAD_BYTES: ${FOUNDORA_KNOWLEDGE_MAX_UPLOAD_BYTES:-5242880}
  FOUNDORA_KNOWLEDGE_MAX_EXTRACTED_CHARACTERS: ${FOUNDORA_KNOWLEDGE_MAX_EXTRACTED_CHARACTERS:-1000000}

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg18-bookworm@sha256:2ba9ca5f2e7daa0f0e7723cba1ee9167bab54efd3640516a44ac1a928dd67e7a
    environment:
      POSTGRES_DB: foundora
      POSTGRES_USER: foundora
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundora -d foundora"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  redis:
    image: redis:8.2.8-bookworm
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  migrate:
    build:
      context: ./apps/api
      target: runtime
    environment: *api-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./apps/api
      target: runtime
    environment:
      <<: *api-environment
      FOUNDORA_ALLOWED_ORIGINS: http://localhost:${WEB_PORT:-3000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - knowledge_data:/var/lib/foundora/knowledge
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready', timeout=3)",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  worker:
    build:
      context: ./apps/api
      target: runtime
    environment:
      <<: *api-environment
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    command: ["python", "-m", "foundora.worker"]
    volumes:
      - knowledge_data:/var/lib/foundora/knowledge
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-m", "foundora.worker_health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runtime
    environment:
      API_INTERNAL_URL: http://api:8000
      API_MODEL_REQUEST_TIMEOUT_MS: ${API_MODEL_REQUEST_TIMEOUT_MS:-300000}
      FOUNDORA_PUBLIC_ORIGIN: http://localhost:${WEB_PORT:-3000}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  api-quality:
    profiles: ["quality"]
    build:
      context: ./apps/api
      target: development
    environment:
      FOUNDORA_ENVIRONMENT: test

  web-quality:
    profiles: ["quality"]
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: development
    environment:
      NEXT_TELEMETRY_DISABLED: "1"

volumes:
  postgres_data:
  redis_data:
  knowledge_data:
